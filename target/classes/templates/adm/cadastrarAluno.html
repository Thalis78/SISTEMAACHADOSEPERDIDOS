<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layoutPadraoAdm.html}"
>
<head>
    <title>CADASTRAR</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div layout:fragment="container" >


    <p
            id="toast-message"
            th:text="${mensagem}"
            th:class="${style} + ' fixed top-8 left-[70%] z-50 px-6 py-3 rounded-xl shadow-lg transition-all duration-500 transform scale-100 opacity-100 min-w-[300px] text-center text-sm font-semibold'"
            th:classappend="${mensagem} ? ' show-toast' : ''"
            class="hidden"
    ></p>


    <div class="max-w-sm mx-auto p-8 bg-white rounded-2xl shadow-xl border border-emerald-200">
        <form method="post" th:action="@{/cadastroRealizado}" th:object="${alunoModel}" class="space-y-6">

            <h2 class="text-2xl font-bold text-gray-800 text-center mb-4">
                Cadastrar Aluno
            </h2>

            <div class="relative">
                <label class="absolute -top-3 left-3 bg-white px-1 text-sm text-gray-500">Nome do aluno</label>
                <input
                        type="text"
                        th:field="*{nome}"
                        required
                        placeholder="Digite o nome completo"
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl text-sm text-black focus:ring-emerald-400 focus:border-emerald-500 transition outline-none shadow-sm placeholder-transparent"
                />
            </div>

            <div class="relative">
                <label class="absolute -top-3 left-3 bg-white px-1 text-sm text-gray-500">Identificador (CPF/RG)</label>
                <input
                        type="text"
                        th:field="*{identificador}"
                        required
                        placeholder="CPF ou RG"
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl text-sm text-black focus:ring-emerald-400 focus:border-emerald-500 transition outline-none shadow-sm placeholder-transparent"
                />
            </div>

            <div>
                <button
                        type="submit"
                        class="w-full py-3 rounded-xl font-semibold text-white bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 shadow-lg transition transform hover:scale-105"
                >
                    Cadastrar
                </button>
            </div>

        </form>
    </div>


</div>
</body>
</html>

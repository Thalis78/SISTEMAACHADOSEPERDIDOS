<!DOCTYPE html>
<html
  lang="pt"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layoutPadraoAdm.html}"
>
  <head>
    <title>Cadastrar Documento</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>

  <body>
    <div layout:fragment="container">
      <p
        id="toast-message"
        th:text="${mensagem}"
        th:class="${style} + ' fixed top-8 left-[70%] z-50 px-4 py-2 rounded-md shadow-md transition-all duration-500 transform scale-100 opacity-100 min-w-[250px] text-center text-sm font-semibold'"
        th:classappend="${mensagem} ? ' show-toast' : ''"
        class="hidden"
      ></p>

      <div class="max-w-sm mx-auto p-6 bg-white rounded-xl shadow-md">
        <form
          method="post"
          th:action="@{/cadastrarDocumentoRealizado}"
          th:object="${itemPerdido}"
        >
          <h2 class="text-xl font-semibold text-gray-800 text-center mb-5">
            Cadastrar Documento
          </h2>

          <div class="mb-3">
            <label class="block text-sm font-medium text-gray-600 mb-1">
              Selecione o Aluno
            </label>
            <select
              id="alunoSelect"
              name="alunoId"
              required
              class="w-full p-2 border border-gray-300 rounded-md text-sm text-black focus:ring-emerald-400 focus:border-emerald-500 transition outline-none"
            >
              <option
                th:each="aluno : ${alunos}"
                th:value="${aluno.id}"
                th:text="${aluno.nome + ' - ' + aluno.identificador}"
              ></option>
            </select>
          </div>

          <div class="mb-3">
            <label class="block text-sm font-medium text-gray-600 mb-1">
              Tipo de Documento
            </label>
            <select
              th:field="*{tipoDocumento}"
              required
              class="w-full p-2 border border-gray-300 rounded-md text-sm text-black focus:ring-emerald-400 focus:border-emerald-500 transition outline-none"
            >
              <option th:value="CPF">CPF</option>
              <option th:value="RG">RG</option>
              <option th:value="CNH">CNH</option>
              <option th:value="OUTRO">OUTRO</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="block text-sm font-medium text-gray-600 mb-1">
              Data
            </label>
            <input
              type="date"
              th:field="*{data}"
              required
              class="w-full p-2 border border-gray-300 rounded-md text-sm text-black focus:ring-emerald-400 focus:border-emerald-500 transition outline-none"
            />
          </div>

          <div class="mt-4">
            <button
              type="submit"
              class="w-full bg-emerald-600 text-white py-2.5 rounded-md font-medium text-sm hover:bg-emerald-700 transition transform hover:scale-105"
            >
              Cadastrar Documento
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
